<title>DALZON BUILD — Site</title><meta id="seoDescription" name="description" content=""><meta id="ogTitle" property="og:title" content=""><meta id="ogDescription" property="og:description" content=""><meta id="ogImage" property="og:image" content=""><meta id="twitterCard" name="twitter:card" content="summary_large_image"><link id="siteFavicon" rel="icon" href="">

<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--site-font,Inter),Arial,sans-serif;background:var(--bg,#f6fbfa);color:#101827}a{color:inherit}.site-nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 6%;background:color-mix(in srgb,var(--bg,#f6fbfa) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid rgba(16,24,39,.08)}.brand{font-family:"Space Grotesk";font-weight:700}.nav-links{display:flex;gap:24px;font-size:14px}.hero{padding:110px 8%;min-height:70vh;display:flex;flex-direction:column;justify-content:center;max-width:1100px}.hero small,.block small{letter-spacing:.16em;font-weight:700;font-size:11px;color:var(--accent,#101827)}h1,h2{font-family:"Space Grotesk";margin:14px 0}h1{font-size:clamp(42px,7vw,82px);line-height:.98;max-width:900px}h2{font-size:clamp(30px,4vw,48px)}p{line-height:1.75;color:#536070;max-width:760px}.hero p{font-size:18px}.cta{display:inline-block;width:max-content;margin-top:22px;padding:14px 22px;border-radius:var(--site-radius,10px);background:var(--accent,#101827);color:white;text-decoration:none;font-weight:700}.block{padding:80px 8%;max-width:1200px;margin:auto}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}.gallery img{width:100%;height:260px;object-fit:cover;border-radius:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.card{padding:28px;border:1px solid rgba(16,24,39,.1);border-radius:18px;background:rgba(255,255,255,.55)}.contact{padding-bottom:110px}.footer{padding:30px 8%;border-top:1px solid rgba(16,24,39,.1);font-size:13px;color:#697586}@media(max-width:700px){.nav-links{display:none}.hero{padding:80px 6%}.block{padding:60px 6%}.gallery,.cards{grid-template-columns:1fr}.gallery img{height:220px}}

/* Styles spécifiques aux modèles */
body.template-store{background:#fffaf4;color:#211b16}body.template-store .site-nav{background:rgba(255,250,244,.9)}body.template-store .hero{max-width:1250px;margin:auto;text-align:center;align-items:center;background:linear-gradient(135deg,#fffaf4,#f4eadc)}body.template-store .cta{border-radius:999px}body.template-store .gallery img{border-radius:10px}
body.template-portfolio{background:#0b0d10;color:#f4f5f7}body.template-portfolio p{color:#aab0ba}body.template-portfolio .site-nav{background:rgba(11,13,16,.9);color:#fff;border-color:#252932}body.template-portfolio .hero{max-width:1250px;margin:auto}body.template-portfolio .hero h1{font-size:clamp(48px,9vw,110px)}body.template-portfolio .card{background:#14171c;border-color:#292e37;color:#fff}
body.template-school{background:#f4f7fb;color:#122033}body.template-school .site-nav{background:rgba(244,247,251,.92)}body.template-school .hero{max-width:1200px;margin:auto;background:linear-gradient(135deg,#e9f1ff,#f7fbff);border-radius:0 0 32px 32px}body.template-school .card{background:#fff;border-color:#dce5f2;box-shadow:0 10px 30px rgba(30,60,100,.07)}
body.template-restaurant{background:#faf6f0;color:#251b15}body.template-restaurant .site-nav{background:rgba(250,246,240,.92)}body.template-restaurant .hero{max-width:1250px;margin:auto;text-align:center;align-items:center;min-height:78vh;background:linear-gradient(135deg,#f3e5d2,#fffaf4)}body.template-restaurant .cta{border-radius:999px}body.template-restaurant .card{background:#fffaf4;border-color:#eadbc8}
body.template-blog{background:#fff;color:#171717}body.template-blog .site-nav{background:rgba(255,255,255,.94)}body.template-blog .hero{max-width:900px;margin:auto;padding-top:90px;padding-bottom:90px}body.template-blog .hero h1{font-size:clamp(42px,6vw,76px)}body.template-blog .block{max-width:900px}body.template-blog .card{background:#fff;border-color:#e7e7e7}
body.template-business .hero{max-width:1250px;margin:auto}
</style>
</head>
<body>
<nav class="site-nav"><div class="brand" id="brand"></div><div class="nav-links" id="nav"></div></nav>
<main id="app"></main>
<script src="supabase-config.js?v=20261007-1"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
async function load(){
 if(!id){document.getElementById("app").innerHTML="<section class='hero'><h1>Site introuvable</h1><p>Identifiant de site manquant.</p></section>";return}
 try{
  const r=await fetch(window.DALZON_SUPABASE_URL+"/rest/v1/sites?id=eq."+encodeURIComponent(id)+"&select=*",{headers:{apikey:window.DALZON_SUPABASE_ANON_KEY}});
  const rows=await r.json(); if(!r.ok||!rows.length||rows[0].status!=="published")throw new Error("Site non publié.");
  const s=rows[0],root=s.content||{},pages=Array.isArray(root.pages)&&root.pages.length?root.pages:[],requested=new URLSearchParams(location.search).get("page")||"home",selected=pages.find(p=>p.id===requested)||pages.find(p=>p.id==="home")||pages[0],c=selected||root,sections=Array.isArray(c.sections)&&c.sections.length?c.sections:["hero","about","services","contact"],gallery=Array.isArray(c.gallery)?c.gallery:[];
  document.body.className="template-"+(root.template||c.template||s.template||"business");document.documentElement.style.setProperty("--site-radius",(root.radius??c.radius??12)+"px");document.documentElement.style.setProperty("--site-font",root.font==="serif"?"Georgia":root.font==="grotesk"?"Space Grotesk":root.font==="system"?"system-ui":"Inter");document.documentElement.style.setProperty("--accent",c.accentColor||"#101827");document.documentElement.style.setProperty("--bg",c.bgColor||"#f6fbfa");
  document.title=c.seoTitle||((c.brandName||s.name)+" — DALZON BUILD");const seo=c.seoDescription||c.aboutText||"Site professionnel créé avec DALZON BUILD.";document.getElementById("seoDescription").content=seo;document.getElementById("ogTitle").content=document.title;document.getElementById("ogDescription").content=seo;if(c.ogImage){document.getElementById("ogImage").content=c.ogImage}if(c.faviconUrl){document.getElementById("siteFavicon").href=c.faviconUrl}document.getElementById("brand").textContent=c.brandName||s.name;
  const nav=[];if(pages.length>1){pages.forEach(p=>nav.push("<a href='site.html?id="+encodeURIComponent(s.id)+"&page="+encodeURIComponent(p.id)+"'>"+esc(p.name||p.pageName||"Page")+"</a>"))}else{if(sections.includes("about"))nav.push("<a href='#about'>À propos</a>");if(sections.includes("services"))nav.push("<a href='#services'>Services</a>");if(sections.includes("gallery")&&gallery.length)nav.push("<a href='#gallery'>Galerie</a>");if(sections.includes("contact"))nav.push("<a href='#contact'>Contact</a>")}document.getElementById("nav").innerHTML=nav.join("");
  let out="";
  if(sections.includes("hero"))out+="<section class='hero' id='home'><small>BIENVENUE</small><h1>"+esc(c.heroTitle||"Construisez votre présence en ligne.")+"</h1><p>"+esc(c.heroText||"Une expérience digitale claire, moderne et professionnelle.")+"</p><a class='cta' href='"+safeHref(c.heroLink||"#contact")+"'>"+esc(c.heroButton||"Nous contacter")+"</a></section>";
  if(sections.includes("about"))out+="<section class='block' id='about'><small>À PROPOS</small><h2>"+esc(c.aboutTitle||"À propos de votre activité")+"</h2><p>"+esc(c.aboutText||"Présentez votre histoire, vos valeurs et ce qui vous rend unique.")+"</p></section>";
  if(sections.includes("services"))out+="<section class='block' id='services'><small>SERVICES</small><h2>"+esc(c.servicesTitle||"Ce que nous proposons")+"</h2><div class='cards'><article class='card'><h3>"+esc(c.service1||"Expertise")+"</h3><p>"+esc(c.serviceText1||"Des services pensés pour vos besoins.")+"</p></article><article class='card'><h3>"+esc(c.service2||"Qualité")+"</h3><p>"+esc(c.serviceText2||"Une présence professionnelle et responsive.")+"</p></article><article class='card'><h3>"+esc(c.service3||"Proximité")+"</h3><p>"+esc(c.serviceText3||"Restez proche de vos clients.")+"</p></article></div></section>";
  if(sections.includes("gallery"))out+="<section class='block' id='gallery'><small>GALERIE</small><h2>Nos images</h2><div class='gallery'>"+(gallery.length?gallery.map(u=>"<img src='"+safeAttr(u)+"' alt='Image du site' loading='lazy'>").join(""):"<p>Aucune image disponible.</p>")+"</div></section>";
  if(sections.includes("testimonials"))out+="<section class='block' id='testimonials'><small>TÉMOIGNAGES</small><h2>"+esc(c.testimonialsTitle||"Ils nous font confiance")+"</h2><div class='cards'><article class='card'><h3>"+esc(c.testimonial1Name||"Client satisfait")+"</h3><p>"+esc(c.testimonial1Text||"Une expérience professionnelle et efficace.")+"</p></article><article class='card'><h3>"+esc(c.testimonial2Name||"Excellent service")+"</h3><p>"+esc(c.testimonial2Text||"Un accompagnement simple et clair.")+"</p></article></div></section>";if(sections.includes("faq"))out+="<section class='block' id='faq'><small>FAQ</small><h2>"+esc(c.faqTitle||"Questions fréquentes")+"</h2><div class='cards'><article class='card'><h3>"+esc(c.faq1Question||"Comment ça marche ?")+"</h3><p>"+esc(c.faq1Answer||"Choisissez un modèle, personnalisez votre contenu et publiez.")+"</p></article><article class='card'><h3>"+esc(c.faq2Question||"Puis-je modifier mon site ?")+"</h3><p>"+esc(c.faq2Answer||"Oui, vous pouvez modifier votre contenu depuis l’éditeur.")+"</p></article></div></section>";if(sections.includes("team"))out+="<section class='block' id='team'><small>ÉQUIPE</small><h2>"+esc(c.teamTitle||"Notre équipe")+"</h2><div class='cards'><article class='card'><h3>"+esc(c.member1Name||"Votre équipe")+"</h3><p>"+esc(c.member1Role||"Direction")+"</p></article><article class='card'><h3>"+esc(c.member2Name||"Collaborateur")+"</h3><p>"+esc(c.member2Role||"Expertise")+"</p></article></div></section>";if(sections.includes("stats"))out+="<section class='block' id='stats'><small>STATISTIQUES</small><h2>"+esc(c.statsTitle||"Nos chiffres")+"</h2><div class='cards'><article class='card'><h3>"+esc(c.stat1Value||"100+")+"</h3><p>"+esc(c.stat1Label||"Projets réalisés")+"</p></article><article class='card'><h3>"+esc(c.stat2Value||"98%")+"</h3><p>"+esc(c.stat2Label||"Clients satisfaits")+"</p></article></div></section>";if(sections.includes("contact"))out+="<section class='block contact' id='contact'><small>CONTACT</small><h2>"+esc(c.contactTitle||"Parlons de votre projet")+"</h2><p>"+esc(c.contactText||"Contactez-nous pour obtenir plus d’informations.")+"</p><a class='cta' href='"+safeHref(c.heroLink||("mailto:"+(c.contactEmail||"contact@example.com")))+"'>"+esc(c.heroButton||"Nous contacter")+"</a></section>";
  if(sections.includes("footer"))out+="<footer class='footer'>© "+new Date().getFullYear()+" "+esc(c.brandName||s.name)+" · "+esc(c.footerText||"Tous droits réservés.")+"</footer>";
  if(c.whatsapp||c.instagram||c.facebook||c.tiktok){const links=[c.whatsapp?["WhatsApp","https://wa.me/"+String(c.whatsapp).replace(/\\D/g,"")]:null,c.instagram?["Instagram",c.instagram]:null,c.facebook?["Facebook",c.facebook]:null,c.tiktok?["TikTok",c.tiktok]:null].filter(Boolean);if(links.length)out+="<div class='block' style='padding-top:20px;padding-bottom:20px'><small>NOUS SUIVRE</small><div class='nav-links' style='margin-top:12px'>"+links.map(x=>"<a href='"+safeHref(x[1])+"' target='_blank' rel='noopener'>"+esc(x[0])+"</a>").join("")+"</div></div>"}document.getElementById("app").innerHTML=out;
 }catch(e){document.getElementById("app").innerHTML="<section class='hero'><h1>Site non disponible</h1><p>"+esc(e.message)+"</p></section>"}
}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function safeAttr(v){return esc(v).replace(/'/g,"&#039;")}
function safeHref(v){const x=String(v||"#").trim();return /^(https?:|mailto:|tel:|#|\/)/i.test(x)?x.replace(/"/g,"%22"):"#"}
load();
</script>
</body></html>
