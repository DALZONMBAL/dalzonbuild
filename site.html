<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DALZON BUILD — Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg,#f6fbfa);color:#101827}a{color:inherit}.site-nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 6%;background:color-mix(in srgb,var(--bg,#f6fbfa) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid rgba(16,24,39,.08)}.brand{font-family:"Space Grotesk";font-weight:700}.nav-links{display:flex;gap:24px;font-size:14px}.hero{padding:110px 8%;min-height:70vh;display:flex;flex-direction:column;justify-content:center;max-width:1100px}.hero small,.block small{letter-spacing:.16em;font-weight:700;font-size:11px;color:var(--accent,#101827)}h1,h2{font-family:"Space Grotesk";margin:14px 0}h1{font-size:clamp(42px,7vw,82px);line-height:.98;max-width:900px}h2{font-size:clamp(30px,4vw,48px)}p{line-height:1.75;color:#536070;max-width:760px}.hero p{font-size:18px}.cta{display:inline-block;width:max-content;margin-top:22px;padding:14px 22px;border-radius:10px;background:var(--accent,#101827);color:white;text-decoration:none;font-weight:700}.block{padding:80px 8%;max-width:1200px;margin:auto}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}.gallery img{width:100%;height:260px;object-fit:cover;border-radius:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.card{padding:28px;border:1px solid rgba(16,24,39,.1);border-radius:18px;background:rgba(255,255,255,.55)}.contact{padding-bottom:110px}.footer{padding:30px 8%;border-top:1px solid rgba(16,24,39,.1);font-size:13px;color:#697586}@media(max-width:700px){.nav-links{display:none}.hero{padding:80px 6%}.block{padding:60px 6%}.gallery,.cards{grid-template-columns:1fr}.gallery img{height:220px}}

/* Styles spécifiques aux modèles */
body.template-store{background:#fffaf4;color:#211b16}body.template-store .site-nav{background:rgba(255,250,244,.9)}body.template-store .hero{max-width:1250px;margin:auto;text-align:center;align-items:center;background:linear-gradient(135deg,#fffaf4,#f4eadc)}body.template-store .cta{border-radius:999px}body.template-store .gallery img{border-radius:10px}
body.template-portfolio{background:#0b0d10;color:#f4f5f7}body.template-portfolio p{color:#aab0ba}body.template-portfolio .site-nav{background:rgba(11,13,16,.9);color:#fff;border-color:#252932}body.template-portfolio .hero{max-width:1250px;margin:auto}body.template-portfolio .hero h1{font-size:clamp(48px,9vw,110px)}body.template-portfolio .card{background:#14171c;border-color:#292e37;color:#fff}
body.template-school{background:#f4f7fb;color:#122033}body.template-school .site-nav{background:rgba(244,247,251,.92)}body.template-school .hero{max-width:1200px;margin:auto;background:linear-gradient(135deg,#e9f1ff,#f7fbff);border-radius:0 0 32px 32px}body.template-school .card{background:#fff;border-color:#dce5f2;box-shadow:0 10px 30px rgba(30,60,100,.07)}
body.template-restaurant{background:#faf6f0;color:#251b15}body.template-restaurant .site-nav{background:rgba(250,246,240,.92)}body.template-restaurant .hero{max-width:1250px;margin:auto;text-align:center;align-items:center;min-height:78vh;background:linear-gradient(135deg,#f3e5d2,#fffaf4)}body.template-restaurant .cta{border-radius:999px}body.template-restaurant .card{background:#fffaf4;border-color:#eadbc8}
body.template-blog{background:#fff;color:#171717}body.template-blog .site-nav{background:rgba(255,255,255,.94)}body.template-blog .hero{max-width:900px;margin:auto;padding-top:90px;padding-bottom:90px}body.template-blog .hero h1{font-size:clamp(42px,6vw,76px)}body.template-blog .block{max-width:900px}body.template-blog .card{background:#fff;border-color:#e7e7e7}
body.template-business .hero{max-width:1250px;margin:auto}
</style>
</head>
<body>
<nav class="site-nav"><div class="brand" id="brand"></div><div class="nav-links" id="nav"></div></nav>
<main id="app"></main>
<script src="supabase-config.js?v=20261007-1"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
async function load(){
 if(!id){document.getElementById("app").innerHTML="<section class='hero'><h1>Site introuvable</h1><p>Identifiant de site manquant.</p></section>";return}
 try{
  const r=await fetch(window.DALZON_SUPABASE_URL+"/rest/v1/sites?id=eq."+encodeURIComponent(id)+"&select=*",{headers:{apikey:window.DALZON_SUPABASE_ANON_KEY}});
  const rows=await r.json(); if(!r.ok||!rows.length||rows[0].status!=="published")throw new Error("Site non publié.");
  const s=rows[0],c=s.content||{},sections=Array.isArray(c.sections)&&c.sections.length?c.sections:["hero","about","services","contact"],gallery=Array.isArray(c.gallery)?c.gallery:[];
  document.body.className="template-"+(s.template||"business");document.documentElement.style.setProperty("--accent",c.accentColor||"#101827");document.documentElement.style.setProperty("--bg",c.bgColor||"#f6fbfa");
  document.title=(c.brandName||s.name)+" — DALZON BUILD";document.getElementById("brand").textContent=c.brandName||s.name;
  const nav=[]; if(sections.includes("about"))nav.push("<a href='#about'>À propos</a>");if(sections.includes("services"))nav.push("<a href='#services'>Services</a>");if(sections.includes("gallery")&&gallery.length)nav.push("<a href='#gallery'>Galerie</a>");if(sections.includes("contact"))nav.push("<a href='#contact'>Contact</a>");document.getElementById("nav").innerHTML=nav.join("");
  let out="";
  if(sections.includes("hero"))out+="<section class='hero' id='home'><small>BIENVENUE</small><h1>"+esc(c.heroTitle||"Construisez votre présence en ligne.")+"</h1><p>"+esc(c.heroText||"Une expérience digitale claire, moderne et professionnelle.")+"</p><a class='cta' href='"+safeHref(c.heroLink||"#contact")+"'>"+esc(c.heroButton||"Nous contacter")+"</a></section>";
  if(sections.includes("about"))out+="<section class='block' id='about'><small>À PROPOS</small><h2>"+esc(c.aboutTitle||"À propos de votre activité")+"</h2><p>"+esc(c.aboutText||"Présentez votre histoire, vos valeurs et ce qui vous rend unique.")+"</p></section>";
  if(sections.includes("services"))out+="<section class='block' id='services'><small>SERVICES</small><h2>Ce que nous proposons</h2><div class='cards'><article class='card'><h3>Expertise</h3><p>Des services pensés pour vos besoins.</p></article><article class='card'><h3>Qualité</h3><p>Une présence professionnelle et responsive.</p></article><article class='card'><h3>Proximité</h3><p>Restez proche de vos clients.</p></article></div></section>";
  if(sections.includes("gallery"))out+="<section class='block' id='gallery'><small>GALERIE</small><h2>Nos images</h2><div class='gallery'>"+(gallery.length?gallery.map(u=>"<img src='"+safeAttr(u)+"' alt='Image du site' loading='lazy'>").join(""):"<p>Aucune image disponible.</p>")+"</div></section>";
  if(sections.includes("contact"))out+="<section class='block contact' id='contact'><small>CONTACT</small><h2>Parlons de votre projet</h2><p>"+esc("Contactez-nous pour obtenir plus d’informations.")+"</p><a class='cta' href='"+safeHref(c.heroLink||"mailto:contact@example.com")+"'>"+esc(c.heroButton||"Nous contacter")+"</a></section>";
  if(sections.includes("footer"))out+="<footer class='footer'>© "+new Date().getFullYear()+" "+esc(c.brandName||s.name)+"</footer>";
  document.getElementById("app").innerHTML=out;
 }catch(e){document.getElementById("app").innerHTML="<section class='hero'><h1>Site non disponible</h1><p>"+esc(e.message)+"</p></section>"}
}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function safeAttr(v){return esc(v).replace(/'/g,"&#039;")}
function safeHref(v){const x=String(v||"#").trim();return /^(https?:|mailto:|tel:|#|\/)/i.test(x)?x.replace(/"/g,"%22"):"#"}
load();
</script>
</body></html>
